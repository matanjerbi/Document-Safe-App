name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (document parser)
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DocumentSafe-v1.0.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: כספת v1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            התקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו.
          files: DocumentSafe-v1.0.${{ github.run_number }}.apk
          make_latest: true
